[project]
name = "weighted-dla"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Vasil Ivanov", email = "ivanovvasil99@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "concave-hull>=0.1.3",
    "marimo>=0.25.2",
    "matplotlib>=3.11.2",
    "ngsolve>=6.2.2608",
    "numba>=0.68.0",
    "numpy>=2.5.4",
